<h2>Available Courses</h2>

<p *ngIf="isLoading">
    Loading courses...
</p>
<input

    [(ngModel)]="searchTerm"

    placeholder="Search courses">

<button

    (click)="searchCourses()">

    Search

</button>
<p *ngIf="errorMessage" class="error">

    {{ errorMessage }}

</p>
<div
    *ngFor="let course of courses"
    (click)="viewCourse(course.id)">

    <app-course-card
        [course]="course">
    </app-course-card>

</div>

<ng-template #noCourses>

    <p *ngIf="courses.length === 0">
        No courses available.
    </p>

</ng-template>

<p *ngIf="selectedCourseId">
    Selected Course ID:
    {{ selectedCourseId }}
</p>
