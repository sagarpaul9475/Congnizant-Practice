<h1>{{ portalName }}</h1>

<p>
  Manage your courses, monitor your academic progress, and enroll in new
  subjects easily.
</p>

<button
  [disabled]="!isPortalActive"
  (click)="onEnrollClick()">
  Enroll Now
</button>

<p>{{ message }}</p>

<hr>

<h3>Search Courses</h3>

<input
  type="text"
  [(ngModel)]="searchTerm"
  placeholder="Search a course">

<p>Searching for: {{ searchTerm }}</p>

<hr>

<div class="stats">

  <div class="card">
    <h2>12</h2>
    <p>Courses Available</p>
  </div>

  <div class="card">
    <h2>3</h2>
    <p>Enrolled</p>
  </div>

  <div class="card">
    <h2>3.8</h2>
    <p>GPA</p>
  </div>

</div>
