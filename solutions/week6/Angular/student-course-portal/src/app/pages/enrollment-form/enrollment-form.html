<h2>Student Enrollment Form</h2>

<form #enrollForm="ngForm"
      (ngSubmit)="onSubmit(enrollForm)">

  <label>Name</label><br>

  <input
      type="text"
      name="studentName"
      [(ngModel)]="studentName"
      required>

  <br><br>

  <label>Email</label><br>

  <input
      type="email"
      name="studentEmail"
      [(ngModel)]="studentEmail"
      required>

  <br><br>

  <label>Course ID</label><br>

  <input
      type="number"
      name="courseId"
      [(ngModel)]="courseId"
      required>

  <br><br>

  <label>Semester</label><br>

  <select
      name="preferredSemester"
      [(ngModel)]="preferredSemester">

      <option>Odd</option>
      <option>Even</option>

  </select>

  <br><br>

  <label>

      <input
          type="checkbox"
          name="agreeToTerms"
          [(ngModel)]="agreeToTerms">

      I agree to the Terms & Conditions

  </label>

  <br><br>

  <button
      type="submit"
      [disabled]="enrollForm.invalid">

      Submit

  </button>

</form>
