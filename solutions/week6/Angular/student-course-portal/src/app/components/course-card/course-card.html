<div
    class="course-card"
    [ngClass]="cardClasses"
    [ngStyle]="{
      'border-left':
        course.gradeStatus === 'passed'
          ? '6px solid green'
          : course.gradeStatus === 'failed'
          ? '6px solid red'
          : '6px solid gray'
    }">

    <h3>{{ course.name }}</h3>

    <p><strong>Code:</strong> {{ course.code }}</p>

    <p><strong>Credits:</strong> {{ course.credits }}</p>

    <p>
        Status:

        <span [ngSwitch]="course.gradeStatus">

            <span *ngSwitchCase="'passed'" style="color:green">
                Passed
            </span>

            <span *ngSwitchCase="'failed'" style="color:red">
                Failed
            </span>

            <span *ngSwitchDefault style="color:gray">
                Pending
            </span>

        </span>
    </p>

    <button (click)="enroll()">
        {{ isEnrolled ? 'Enrolled' : 'Enroll' }}
    </button>

    <button (click)="toggleDetails()">
        {{ isExpanded ? 'Hide Details' : 'Show Details' }}
    </button>

    <div *ngIf="isExpanded">
        <hr>

        <p>
            This course teaches {{ course.name }} concepts.
        </p>

        <p>
            Course Code: {{ course.code }}
        </p>
    </div>

</div>
