<div class="course-card">

    <h3>{{ course.name }}</h3>

    <p>Code: {{ course.code }}</p>

    <p>Credits: {{ course.credits }}</p>

    <p>

        Status:

        <span [ngSwitch]="course.gradeStatus">

            <span *ngSwitchCase="'passed'"
                  style="color:green">
                Passed
            </span>

            <span *ngSwitchCase="'failed'"
                  style="color:red">
                Failed
            </span>

            <span *ngSwitchDefault
                  style="color:gray">
                Pending
            </span>

        </span>

    </p>

    <button (click)="enroll()">
        Enroll
    </button>

</div>
